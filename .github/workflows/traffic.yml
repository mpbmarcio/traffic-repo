name: Collect Traffic Data from Multiple Repos

on:
  schedule:
    - cron: '0 0 * * 0'   # roda todo domingo à meia-noite
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-logs
  cancel-in-progress: true

jobs:
  collect-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: traffic-data   # já inicia na branch correta

      - name: Get traffic for challenge-forum-hub
        run: |
          FILE="logs/challenge-forum-hub-$(date +'%Y-%m-%d').txt"
          mkdir -p logs
          echo "Date: $(date)" >> $FILE
          echo "Repo: challenge-forum-hub" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/challenge-forum-hub/traffic/views \
               | jq . >> $FILE
          echo "" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/challenge-forum-hub/traffic/clones \
               | jq . >> $FILE
          echo "" >> $FILE

      - name: Get traffic for quarkus-kafka-payments
        run: |
          FILE="logs/quarkus-kafka-payments-$(date +'%Y-%m-%d').txt"
          mkdir -p logs
          echo "Date: $(date)" >> $FILE
          echo "Repo: quarkus-kafka-payments" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/quarkus-kafka-payments/traffic/views \
               | jq . >> $FILE
          echo "" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/quarkus-kafka-payments/traffic/clones \
               | jq . >> $FILE
          echo "" >> $FILE

      - name: Get traffic for events-api
        run: |
          FILE="logs/events-api-$(date +'%Y-%m-%d').txt"
          mkdir -p logs
          echo "Date: $(date)" >> $FILE
          echo "Repo: events-api" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/events-api/traffic/views \
               | jq . >> $FILE
          echo "" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/events-api/traffic/clones \
               | jq . >> $FILE
          echo "" >> $FILE

      - name: Get traffic for erp-mpb
        run: |
          FILE="logs/erp-mpb-$(date +'%Y-%m-%d').txt"
          mkdir -p logs
          echo "Date: $(date)" >> $FILE
          echo "Repo: erp-mpb" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/erp-mpb/traffic/views \
               | jq . >> $FILE
          echo "" >> $FILE
          curl -H "Authorization: token ${{ secrets.TRAFFIC_TOKEN }}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/mpbmarcio/erp-mpb/traffic/clones \
               | jq . >> $FILE
          echo "" >> $FILE

      - name: Commit traffic logs
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git pull origin traffic-data --rebase
          git add logs/*.txt
          git commit -m "Update traffic logs for $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push origin traffic-data
